<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ImgBB Image Uploader</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      max-width: 500px; 
      margin: 40px auto; 
      padding: 20px; 
    }
    .container { 
      background: #f9f9f9; 
      padding: 20px; 
      border-radius: 8px; 
      border: 1px solid #ddd; 
    }
    .result { 
      margin-top: 20px; 
      display: none; 
      background: #eef;
      padding: 15px;
      border-radius: 8px;
    }
    .result img { 
      max-width: 100%; 
      border-radius: 4px; 
      margin-bottom: 10px;
    }
    input[type="text"] { 
      width: 100%; 
      padding: 8px; 
      margin-top: 5px; 
      box-sizing: border-box; 
    }
    button { 
      padding: 10px 16px; 
      background: #007bff; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold;
    }
    button:disabled { 
      background: #ccc; 
    }
    #status {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Upload to ImgBB</h2>
    <input type="file" id="fileInput" accept="image/*">
    <br><br>
    <button id="uploadBtn">Upload Image</button>
    <p id="status"></p>

    <!-- This section stays hidden until a successful upload -->
    <div class="result" id="resultContainer">
      <h3>Upload Successful!</h3>
      <img id="uploadedImage" src="" alt="Uploaded image preview">
      <label for="imageUrl">Permanent Shareable Link:</label>
      <input type="text" id="imageUrl" readonly onclick="this.select()">
    </div>
  </div>

  <script>
    // 1. PASTE YOUR IMGBB API KEY HERE
    const IMGBB_API_KEY = 'ffa4d27769b766c270856e930fa92d43';

    // 2. Grab DOM elements
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusTxt = document.getElementById('status');
    const resultContainer = document.getElementById('resultContainer');
    const uploadedImage = document.getElementById('uploadedImage');
    const imageUrlInput = document.getElementById('imageUrl');

    // 3. Handle the Upload
    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      
      // Basic validation
      if (!file) {
        statusTxt.innerText = "Please select an image first.";
        statusTxt.style.color = "red";
        return;
      }

      if (IMGBB_API_KEY === 'YOUR_API_KEY_HERE') {
        statusTxt.innerText = "Error: You must add your API key to the JavaScript code.";
        statusTxt.style.color = "red";
        return;
      }

      // Update UI for loading state
      uploadBtn.disabled = true;
      statusTxt.innerText = "Uploading to ImgBB... please wait.";
      statusTxt.style.color = "blue";
      resultContainer.style.display = "none";

      // Package the file for the API
      const formData = new FormData();
      formData.append('image', file);

      try {
        // Send the POST request to ImgBB
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        // Check if ImgBB accepted the upload
        if (data.success) {
          statusTxt.innerText = "Upload complete!";
          statusTxt.style.color = "green";
          
          // Display the resulting image and URL
          uploadedImage.src = data.data.url;
          imageUrlInput.value = data.data.url;
          resultContainer.style.display = "block";
          
          // Clear the file input
          fileInput.value = "";
        } else {
          throw new Error(data.error.message || "Upload failed");
        }

      } catch (error) {
        console.error("Upload error:", error);
        statusTxt.innerText = "Error: " + error.message;
        statusTxt.style.color = "red";
      } finally {
        // Always re-enable the button when finished
        uploadBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
