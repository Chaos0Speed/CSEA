<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ImgBB + Google Sheets Gallery</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    .upload-box { background: #f0f0f0; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; max-width: 300px; }
    .upload-box input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .upload-box button { padding: 10px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .upload-box button:disabled { background: #999; cursor: not-allowed; }
    #gallery { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px; }
    .gallery-item { text-align: center; font-size: 14px; background: #f9f9f9; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
    .gallery-item img { width: 150px; height: 150px; object-fit: cover; border-radius: 6px; background: #eee; margin-bottom: 5px; }
    #status { font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Serverless Public Gallery</h1>
  
  <div class="upload-box">
    <input type="text" id="nameInput" placeholder="Enter your name" required>
    <input type="file" id="fileInput" accept="image/*">
    <button id="uploadBtn">Upload to Gallery</button>
    <span id="status"></span>
  </div>

  <h2>Gallery Data</h2>
  <div id="gallery">Loading gallery...</div>

  <!-- Note the type="module" attribute added here -->
  <script type="module">
    // Import the configuration variables from your new config file
    import { config } from './config.js';

    const nameInput = document.getElementById('nameInput');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const statusTxt = document.getElementById('status');
    const galleryDiv = document.getElementById('gallery');

    // --- UPLOAD ROUTINE ---
    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      const uploaderName = nameInput.value.trim();

      if (!uploaderName) return alert("Please enter your name.");
      if (!file) return alert("Please select a file.");

      uploadBtn.disabled = true;
      statusTxt.innerText = "1/2 Uploading image to ImgBB...";

      try {
        const imgFormData = new FormData();
        imgFormData.append('image', file);

        // Fetching IMGBB_API_KEY from the config object
        const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${config.IMGBB_API_KEY}`, {
          method: 'POST',
          body: imgFormData
        });
        const imgbbData = await imgbbRes.json();
        
        if (!imgbbData.success) throw new Error("ImgBB upload failed.");
        const finalImageUrl = imgbbData.data.url;

        statusTxt.innerText = "2/2 Saving data to Google Sheets...";

        const googleFormData = new URLSearchParams();
        // Fetching Form IDs from the config object
        googleFormData.append(config.FORM_ENTRY_ID_NAME, uploaderName);
        googleFormData.append(config.FORM_ENTRY_ID_URL, finalImageUrl);

        // Fetching the Form Action URL from the config object
        await fetch(config.FORM_ACTION_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: googleFormData.toString()
        });

        statusTxt.innerText = "Done! Image uploaded.";
        fileInput.value = "";
        nameInput.value = "";
        
        displayImage(finalImageUrl, uploaderName);

      } catch (error) {
        statusTxt.innerText = "Error: " + error.message;
      } finally {
        uploadBtn.disabled = false;
      }
    });

    // --- LOAD GALLERY ROUTINE ---
    // --- LOAD GALLERY ROUTINE ---
    // --- LOAD GALLERY ROUTINE ---
    async function loadGallery() {
      try {
        // We added strict cache-busting headers here
        const response = await fetch(config.SHEET_CSV_URL, { 
          cache: 'no-store',
          headers: {
            'Pragma': 'no-cache',
            'Cache-Control': 'no-cache'
          }
        });
        
        const csvText = await response.text();
        
        galleryDiv.innerHTML = ""; 
        const rows = csvText.split(/\r?\n/);
        
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row.trim()) continue;
          
          // Robust parser to handle commas inside text
          const columns = [];
          let current = '';
          let inQuotes = false;
          
          for (let char of row) {
            if (char === '"') {
              inQuotes = !inQuotes; 
            } else if (char === ',' && !inQuotes) {
              columns.push(current);
              current = '';
            } else {
              current += char;
            }
          }
          columns.push(current); 
          
          // Column 1 is Name, Column 2 is URL
          const nameData = columns[1] ? columns[1].trim() : "Anonymous";
          const urlData = columns[2] ? columns[2].trim() : "";
          
          if (urlData.startsWith('http')) {
            displayImage(urlData, nameData);
          }
        }
        
        if (galleryDiv.innerHTML === "") {
          galleryDiv.innerHTML = "No images found in the gallery yet.";
        }
        
      } catch (error) {
        galleryDiv.innerHTML = "Could not load gallery data. Check browser console.";
        console.error(error);
      }
    }

    function displayImage(url, name) {
      const container = document.createElement('div');
      container.className = 'gallery-item';

      const img = document.createElement('img');
      img.src = url;

      const label = document.createElement('div');
      label.innerText = name;

      container.appendChild(img);
      container.appendChild(label);
      
      galleryDiv.prepend(container); 
    }

    loadGallery();
  </script>
</body>
</html>
